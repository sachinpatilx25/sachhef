<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HefShine Recordings Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(20, 27, 45, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, #090d16 90%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 16px;
    }
    .container { max-width: 1050px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 15px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }
    .brand-icon svg { width: 28px; height: 28px; fill: white; }
    h1 { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 3px; }
    .header-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 22px rgba(37, 99, 235, 0.5);
      background: #1d4ed8;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }
    .user-pill {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .user-pill:hover { background: rgba(59, 130, 246, 0.2); }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .search-bar { display: flex; gap: 12px; margin-bottom: 20px; }
    .search-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .rec-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: all 0.25s ease;
    }
    .rec-card:hover {
      border-color: rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }
    .badge {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .rec-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      padding-right: 75px;
    }
    .rec-date {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-block { width: 100%; justify-content: center; margin-top: 12px; }
    .download-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-link-action {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .btn-link-action:hover {
      background: rgba(59, 130, 246, 0.3);
      color: #fff;
    }
    .welcome-container {
      max-width: 440px;
      margin: 40px auto;
      text-align: center;
      padding: 36px 30px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }
    .welcome-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
    }
    .welcome-icon svg { width: 34px; height: 34px; fill: white; }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); font-weight: 500; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <div>
          <h1>HefShine Recordings Portal</h1>
          <div class="subtitle">Cloud Stream & Direct Download Platform</div>
        </div>
      </div>
      <div class="header-controls" id="header-user-controls" style="display: none;">
        <div class="user-pill" onclick="logout()" title="Click to log out">
          <div class="status-dot"></div>
          <span id="user-display">Student</span>
          <span style="font-size: 0.72rem; color: #60a5fa; margin-left: 4px;">(Sign Out)</span>
        </div>
        <button class="btn btn-secondary" onclick="loadRecordings()">🔄 Refresh Classes</button>
      </div>
    </header>

    <!-- Login View -->
    <div id="welcome-view" class="welcome-container" style="display: none;">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
      <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;">Student Login</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px;">Enter your institute credentials to view and download your class recordings.</p>

      <div id="login-error-msg" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; text-align: left;"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Mobile Number / Username</label>
          <input type="text" id="main-username" class="search-input" style="width: 100%;" placeholder="Enter Mobile Number" required autofocus>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="main-password" class="search-input" style="width: 100%;" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit" style="padding: 12px; font-size: 0.95rem;">
          Sign In & View Lectures
        </button>
      </form>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="card" style="display: none;">
      <div class="search-bar">
        <input type="text" id="search-box" class="search-input" placeholder="🔍 Search recordings by topic name or date..." oninput="filterRecordings()">
      </div>
      <div id="grid-container" class="grid">
        <div class="empty-state">Loading your recordings...</div>
      </div>
    </div>
  </div>

  <script>
    let allRecordings = [];

    function getSession() {
      const u = localStorage.getItem('hef_username');
      const jwt = localStorage.getItem('hef_jwt');
      return { username: u, jwt: jwt };
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('main-username').value.trim();
      const p = document.getElementById('main-password').value.trim();
      const btn = document.getElementById('btn-login-submit');
      const errBox = document.getElementById('login-error-msg');

      btn.innerText = 'Connecting...';
      btn.disabled = true;
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.jwt) {
          localStorage.setItem('hef_username', u);
          localStorage.setItem('hef_jwt', data.jwt);
          loadRecordings();
        } else {
          errBox.innerText = data.error || 'Invalid credentials.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.innerText = 'Server error: ' + err;
        errBox.style.display = 'block';
      } finally {
        btn.innerText = 'Sign In & View Lectures';
        btn.disabled = false;
      }
    }

    async function loadRecordings() {
      const session = getSession();
      const welcomeView = document.getElementById('welcome-view');
      const dashView = document.getElementById('dashboard-view');
      const headerControls = document.getElementById('header-user-controls');
      const grid = document.getElementById('grid-container');

      if (!session.jwt) {
        welcomeView.style.display = 'block';
        dashView.style.display = 'none';
        headerControls.style.display = 'none';
        return;
      }

      welcomeView.style.display = 'none';
      dashView.style.display = 'block';
      headerControls.style.display = 'flex';
      document.getElementById('user-display').innerText = `Account: ${session.username}`;

      grid.innerHTML = '<div class="empty-state">Fetching class recordings...</div>';

      try {
        const res = await fetch('/api/recordings', {
          headers: { 'Authorization': 'Bearer ' + session.jwt }
        });
        const data = await res.json();
        if (data.error) {
          if (data.error.includes('expired') || data.error.includes('401')) {
            logout();
            return;
          }
          grid.innerHTML = `<div class="empty-state" style="color: #ef4444;">${data.error}</div>`;
          return;
        }

        allRecordings = data.recordings || [];
        renderRecordings(allRecordings);
      } catch (e) {
        grid.innerHTML = `<div class="empty-state" style="color: #ef4444;">Connection failed: ${e}</div>`;
      }
    }

    function renderRecordings(recs) {
      const grid = document.getElementById('grid-container');
      if (recs.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">No class recordings found on your student portal.</div>';
        return;
      }

      grid.innerHTML = recs.map(r => {
        const dateStr = r.readyAt ? new Date(r.readyAt).toLocaleString() : 'N/A';
        return `
          <div class="rec-card">
            <span class="badge">Online Lecture</span>
            <div>
              <div class="rec-title">${r.title}</div>
              <div class="rec-date">📅 ${dateStr}</div>
            </div>
            <div class="download-actions" id="actions-${r.id}">
              <button class="btn btn-primary btn-block" onclick="getLinks('${r.id}')">
                ⬇ Get Download & Play Links
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function getLinks(recId) {
      const box = document.getElementById('actions-' + recId);
      const session = getSession();
      box.innerHTML = '<div style="font-size: 0.8rem; color: #93c5fd; text-align: center; padding: 10px;">Generating secure video links...</div>';

      try {
        const res = await fetch(`/api/play?id=${encodeURIComponent(recId)}`, {
          headers: { 'Authorization': 'Bearer ' + session.jwt }
        });
        const data = await res.json();
        if (data.error) {
          box.innerHTML = `<div style="color: #ef4444; font-size: 0.8rem;">${data.error}</div>`;
          return;
        }

        box.innerHTML = `
          <a href="${data.screenshare_url}" target="_blank" download class="btn-link-action">
            <span>🖥️ Screen Share Video</span>
            <span>⬇ Download</span>
          </a>
          <a href="${data.webcam_url}" target="_blank" download class="btn-link-action">
            <span>🎙️ Teacher & Audio</span>
            <span>⬇ Download</span>
          </a>
          <a href="${data.playback_url}" target="_blank" class="btn btn-secondary btn-block" style="font-size: 0.82rem;">
            ▶ Open BigBlueButton Player
          </a>
        `;
      } catch (e) {
        box.innerHTML = `<div style="color: #ef4444; font-size: 0.8rem;">Error fetching links: ${e}</div>`;
      }
    }

    function filterRecordings() {
      const q = document.getElementById('search-box').value.toLowerCase().trim();
      if (!q) {
        renderRecordings(allRecordings);
        return;
      }
      const filtered = allRecordings.filter(r => 
        (r.title && r.title.toLowerCase().includes(q)) || 
        (r.readyAt && r.readyAt.toLowerCase().includes(q))
      );
      renderRecordings(filtered);
    }

    function logout() {
      localStorage.removeItem('hef_username');
      localStorage.removeItem('hef_jwt');
      loadRecordings();
    }

    window.onload = loadRecordings;
  </script>
</body>
</html>
