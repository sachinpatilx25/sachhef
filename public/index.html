<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HefShine Recordings Downloader</title>
</head>
<body style="font-family: sans-serif; max-width: 800px; margin: 30px auto; line-height: 1.6; padding: 0 15px;">

  <h2>HefShine Lecture Recordings</h2>
  <hr>

  <!-- Login Area -->
  <div id="login-section">
    <h3>Student Login</h3>
    <div id="login-error" style="color: red; font-weight: bold; margin-bottom: 10px; display: none;"></div>
    <form onsubmit="handleLogin(event)">
      <p>
        <label>Mobile Number / Username:<br>
          <input type="text" id="username" style="padding: 8px; width: 280px;" required autofocus>
        </label>
      </p>
      <p>
        <label>Password:<br>
          <input type="password" id="password" style="padding: 8px; width: 280px;" required>
        </label>
      </p>
      <p>
        <button type="submit" id="btn-login" style="padding: 8px 20px; font-weight: bold; cursor: pointer;">
          Sign In
        </button>
      </p>
    </form>
  </div>

  <!-- Dashboard Area -->
  <div id="dashboard-section" style="display: none;">
    <p>
      Logged in as: <b id="user-display"></b> | 
      <a href="javascript:void(0)" onclick="logout()">[Sign Out]</a> | 
      <a href="javascript:void(0)" onclick="loadRecordings()">[Refresh List]</a>
    </p>
    <hr>

    <h3>Available Classes:</h3>
    <div id="recordings-list">Loading recordings...</div>
  </div>

  <script>
    function getSession() {
      return {
        username: localStorage.getItem('hef_u'),
        jwt: localStorage.getItem('hef_jwt')
      };
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const err = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerText = 'Logging in...';
      err.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.jwt) {
          localStorage.setItem('hef_u', u);
          localStorage.setItem('hef_jwt', data.jwt);
          init();
        } else {
          err.innerText = data.error || 'Invalid credentials';
          err.style.display = 'block';
        }
      } catch (e) {
        err.innerText = 'Connection error: ' + e;
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Sign In';
      }
    }

    async function loadRecordings() {
      const session = getSession();
      const list = document.getElementById('recordings-list');
      list.innerHTML = '<i>Fetching classes...</i>';

      try {
        const res = await fetch('/api/recordings', {
          headers: { 'Authorization': 'Bearer ' + session.jwt }
        });
        const data = await res.json();
        if (data.error) {
          list.innerHTML = '<span style="color: red;">' + data.error + '</span>';
          return;
        }

        const recs = data.recordings || [];
        if (recs.length === 0) {
          list.innerHTML = '<i>No recordings found for your account.</i>';
          return;
        }

        list.innerHTML = '<ol>' + recs.map(r => {
          return `
            <li style="margin-bottom: 20px;">
              <b>${r.title}</b><br>
              <small>Date: ${r.readyAt ? new Date(r.readyAt).toLocaleString() : 'N/A'}</small><br>
              <div id="box-${r.id}" style="margin-top: 8px;">
                <button onclick="getLinks('${r.id}')" style="padding: 6px 14px; cursor: pointer;">
                  Get Single Video File
                </button>
              </div>
            </li>
          `;
        }).join('') + '</ol>';

      } catch (e) {
        list.innerHTML = '<span style="color: red;">Error: ' + e + '</span>';
      }
    }

    async function getLinks(id) {
      const box = document.getElementById('box-' + id);
      const session = getSession();
      box.innerHTML = '<i>Loading video source...</i>';

      try {
        const res = await fetch(`/api/play?id=${encodeURIComponent(id)}`, {
          headers: { 'Authorization': 'Bearer ' + session.jwt }
        });
        const data = await res.json();
        if (data.error) {
          box.innerHTML = '<span style="color:red;">' + data.error + '</span>';
          return;
        }

        box.innerHTML = `
          <div style="background: #f4f4f4; padding: 12px; border: 1px solid #ddd; margin-top: 5px;">
            <p style="margin: 0 0 8px 0;"><b>Download Single File:</b></p>
            <p style="margin: 0 0 6px 0;">
              👉 <a href="${data.screenshare_url}" download="Class_Screen_Recording.webm" target="_blank" style="font-size: 16px; font-weight: bold;">
                Download Screen Video (.webm)
              </a>
            </p>
            <p style="margin: 0 0 6px 0;">
              👉 <a href="${data.webcam_url}" download="Teacher_Audio.webm" target="_blank">
                Download Audio / Webcam (.webm)
              </a>
            </p>
            <p style="margin: 8px 0 0 0;">
              🌐 <a href="${data.playback_url}" target="_blank">Open Full Class in BigBlueButton Player</a>
            </p>
          </div>
        `;
      } catch (e) {
        box.innerHTML = '<span style="color: red;">Error: ' + e + '</span>';
      }
    }

    function logout() {
      localStorage.removeItem('hef_u');
      localStorage.removeItem('hef_jwt');
      init();
    }

    function init() {
      const session = getSession();
      const loginSec = document.getElementById('login-section');
      const dashSec = document.getElementById('dashboard-section');

      if (!session.jwt) {
        loginSec.style.display = 'block';
        dashSec.style.display = 'none';
      } else {
        loginSec.style.display = 'none';
        dashSec.style.display = 'block';
        document.getElementById('user-display').innerText = session.username;
        loadRecordings();
      }
    }

    window.onload = init;
  </script>

</body>
</html>
